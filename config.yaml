capture:
  target_window: "Roblox"
  fps_cap: 60
  region: null                  # null = full window rect, or [x, y, w, h]

detection:
  model: "models/Roblox.onnx"
  confidence: 0.35
  nms_iou: 0.35

tracking:
  max_age: 30
  min_hits: 2

hotkeys:
  detection_toggle: "F6"        # toggle character detection on/off
  lock_toggle: "F7"             # toggle mouse lock on/off
  lock_hold: "F4"               # hold to lock, release to stop

cursor_follow:
  enabled: false
  fps_mode: false               # true = camera-controlled games (low-gain, no prediction, deadzone)
  smoothing: 0.12               # 0.0 = instant snap, 1.0 = no movement
  speed: 1.0
  follow_radius: 150            # pixels around cursor that activate locking
  follow_point: "chest"         # "head" | "chest" | "center"
  prediction_ms: 60             # ms to extrapolate target position forward
  deadzone: 5                   # pixels — no correction within this radius (FPS mode only)
  prefer_closest_depth: false   # true = prefer target with the largest bbox (closest in 3D)
  head_height_ratio: 0.15       # 0.0–1.0 — how far down the bbox the "head" aim point sits
  aim_y_reduce: false           # after locking on a target, suppress Y correction after a delay
  aim_y_reduce_delay: 0.6       # seconds before Y correction is suppressed
  snapback_threshold: 15        # pixels of unexpected cursor movement that triggers a pause
  snapback_pause_ms: 200        # ms to pause the lock after a snap-back is detected
  pid:
    kp: 0.4
    ki: 0.0
    kd: 0.08
  tracker:
    smoothing_factor: 0.5
    stop_threshold: 20.0
    position_deadzone: 4.0

# Triggerbot — auto-clicks when your cursor is inside a detected character's bounding box.
triggerbot:
  enabled: false
  hotkey: "F5"                  # toggle triggerbot on/off
  delay_min_ms: 50              # random click delay — minimum (ms)
  delay_max_ms: 120             # random click delay — maximum (ms)
  padding: 5                    # extra pixels around the bbox edge that count as "inside"

overlay:
  enabled: true
  show_boxes: true
  show_trails: true
  show_velocity: true
  show_radius_circle: true
  show_minimap: true
  show_direction_cone: true
  trail_length: 20
  active_color: [0, 255, 80]
  inactive_color: [0, 200, 255]
  box_thickness: 1
  font_scale: 0.5

perf_dashboard:
  enabled: false

# ─────────────────────────────────────────────────────────────────────────────
# AIMLOCK PRESETS (cursor_follow only — apply from Mouse Lock section in GUI)
# ─────────────────────────────────────────────────────────────────────────────
presets:
  # --- Normal mode ---
  Flick:
    fps_mode: false
    smoothing: 0.05
    speed: 2.0
    follow_radius: 120
    follow_point: "head"
    prediction_ms: 80
    deadzone: 0

  Precise:
    fps_mode: false
    smoothing: 0.12
    speed: 1.4
    follow_radius: 150
    follow_point: "chest"
    prediction_ms: 60
    deadzone: 0

  Smooth:
    fps_mode: false
    smoothing: 0.30
    speed: 1.0
    follow_radius: 220
    follow_point: "chest"
    prediction_ms: 40
    deadzone: 0

  # --- FPS mode ---
  FPS Flick:
    fps_mode: true
    smoothing: 0.55
    speed: 1.2
    follow_radius: 200
    follow_point: "head"
    prediction_ms: 60
    deadzone: 4

  FPS Smooth:
    fps_mode: true
    smoothing: 0.75
    speed: 0.9
    follow_radius: 250
    follow_point: "chest"
    prediction_ms: 40
    deadzone: 6

  FPS Gentle:
    fps_mode: true
    smoothing: 0.88
    speed: 0.7
    follow_radius: 300
    follow_point: "chest"
    prediction_ms: 20
    deadzone: 8

# Full config presets are stored as profile files in the profiles/ directory.
# Load them from the "Saved Profiles" section in the GUI.
