capture:
  target_window: Roblox
  fps_cap: 60
  region: null

detection:
  model: models/yolov8n-default.pt
  confidence: 0.12
  nms_iou: 0.45
  use_background_subtraction: false
  device: cuda
  detect_all_classes: false
  auto_confidence: true
  auto_conf_min: 0.08
  auto_conf_max: 0.50
  auto_conf_target: 5
  team_detection: false

tracking:
  max_age: 30
  min_hits: 2

hotkeys:
  detection_toggle: F6
  lock_toggle: F7
  lock_hold: F4

cursor_follow:
  enabled: false
  fps_mode: false
  smoothing: 0.04
  smoothing_curve: linear
  speed: 2.8
  follow_radius: 220
  follow_point: head
  prediction_ms: 80
  deadzone: 0
  target_class: null
  prefer_closest_depth: false
  snapback_threshold: 30
  snapback_pause_ms: 150

recoil:
  enabled: true
  fire_key: left
  step_ms: 75
  reset_ms: 500
  pattern:
    - [0, 5]
    - [0, 5]
    - [1, 4]
    - [0, 4]
    - [1, 3]
    - [0, 3]
    - [-1, 3]
    - [0, 2]

triggerbot:
  enabled: true
  hotkey: F5
  delay_min_ms: 25
  delay_max_ms: 70
  padding: 6

overlay:
  enabled: true
  show_boxes: true
  show_trails: true
  show_velocity: true
  show_radius_circle: true
  show_minimap: true
  show_direction_cone: true
  trail_length: 20
  active_color: [0, 255, 80]
  inactive_color: [0, 200, 255]
  box_thickness: 2
  font_scale: 0.5

perf_dashboard:
  enabled: false