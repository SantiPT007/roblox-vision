detection:
  model: "models/Roblox.onnx"
  confidence: 0.35
  nms_iou: 0.35

tracking:
  max_age: 30
  min_hits: 2

cursor_follow:
  enabled: false
  fps_mode: false
  smoothing: 0.25
  speed: 1.0
  follow_radius: 180
  follow_point: "chest"
  prediction_ms: 60
  deadzone: 4
  prefer_closest_depth: false
  snapback_threshold: 15
  snapback_pause_ms: 200
  pid:
    kp: 0.35
    ki: 0.01
    kd: 0.10
  tracker:
    smoothing_factor: 0.7
    stop_threshold: 20.0
    position_deadzone: 4.0

triggerbot:
  enabled: false
  hotkey: "F5"
  delay_min_ms: 50
  delay_max_ms: 120
  padding: 5

overlay:
  enabled: true
  show_boxes: true
  show_trails: true
  show_velocity: true
  show_radius_circle: true
  show_minimap: true
  show_direction_cone: true
  trail_length: 20
  active_color: [0, 255, 80]
  inactive_color: [0, 200, 255]
  box_thickness: 1
  font_scale: 0.5
