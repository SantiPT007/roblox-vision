capture:
  target_window: Roblox
  fps_cap: 60
  region: null

detection:
  model: models/yolov8n-default.pt
  confidence: 0.25
  nms_iou: 0.45
  use_background_subtraction: false
  device: cuda
  detect_all_classes: false
  auto_confidence: false
  auto_conf_min: 0.10
  auto_conf_max: 0.60
  auto_conf_target: 3
  team_detection: false

tracking:
  max_age: 30
  min_hits: 2

hotkeys:
  detection_toggle: F6
  lock_toggle: F7
  lock_hold: F4

cursor_follow:
  enabled: false
  fps_mode: false
  smoothing: 0.45
  smoothing_curve: bezier
  speed: 0.8
  follow_radius: 120
  follow_point: chest
  prediction_ms: 30
  deadzone: 0
  target_class: null
  prefer_closest_depth: false
  snapback_threshold: 10
  snapback_pause_ms: 350

recoil:
  enabled: false
  fire_key: left
  step_ms: 100
  reset_ms: 700
  pattern:
    - [0, 2]
    - [0, 2]
    - [0, 1]
    - [0, 1]

triggerbot:
  enabled: false
  hotkey: F5
  delay_min_ms: 80
  delay_max_ms: 180
  padding: 3

overlay:
  enabled: true
  show_boxes: true
  show_trails: false
  show_velocity: false
  show_radius_circle: true
  show_minimap: true
  show_direction_cone: false
  trail_length: 10
  active_color: [0, 255, 80]
  inactive_color: [0, 200, 255]
  box_thickness: 1
  font_scale: 0.5

perf_dashboard:
  enabled: false