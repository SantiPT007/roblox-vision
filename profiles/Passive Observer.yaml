capture:
  target_window: Roblox
  fps_cap: 60
  region: null

detection:
  model: models/yolov8n-default.pt
  confidence: 0.20
  nms_iou: 0.45
  use_background_subtraction: false
  device: cuda
  detect_all_classes: false
  auto_confidence: false
  auto_conf_min: 0.10
  auto_conf_max: 0.60
  auto_conf_target: 3
  team_detection: true

tracking:
  max_age: 40
  min_hits: 1

hotkeys:
  detection_toggle: F6
  lock_toggle: F7
  lock_hold: F4

cursor_follow:
  enabled: false
  fps_mode: false
  smoothing: 0.30
  smoothing_curve: linear
  speed: 1.0
  follow_radius: 150
  follow_point: chest
  prediction_ms: 60
  deadzone: 5
  target_class: null
  prefer_closest_depth: false
  snapback_threshold: 15
  snapback_pause_ms: 200

recoil:
  enabled: false
  fire_key: left
  step_ms: 80
  reset_ms: 600
  pattern:
    - [0, 5]
    - [0, 5]
    - [1, 4]
    - [0, 4]

triggerbot:
  enabled: false
  hotkey: F5
  delay_min_ms: 50
  delay_max_ms: 120
  padding: 5

overlay:
  enabled: true
  show_boxes: true
  show_trails: true
  show_velocity: true
  show_radius_circle: false
  show_minimap: true
  show_direction_cone: true
  trail_length: 25
  active_color: [0, 255, 80]
  inactive_color: [0, 200, 255]
  box_thickness: 1
  font_scale: 0.5

perf_dashboard:
  enabled: true