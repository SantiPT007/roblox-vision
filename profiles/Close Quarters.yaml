capture:
  target_window: Roblox
  fps_cap: 60
  region: null

detection:
  model: models/roblox-character-mid.pt
  confidence: 0.13
  nms_iou: 0.45
  use_background_subtraction: false
  device: cuda
  detect_all_classes: true
  auto_confidence: true
  auto_conf_min: 0.08
  auto_conf_max: 0.45
  auto_conf_target: 6
  team_detection: false

tracking:
  max_age: 20
  min_hits: 1

hotkeys:
  detection_toggle: F6
  lock_toggle: F7
  lock_hold: F4

cursor_follow:
  enabled: false
  fps_mode: false
  smoothing: 0.06
  smoothing_curve: linear
  speed: 3.0
  follow_radius: 280
  follow_point: chest
  prediction_ms: 70
  deadzone: 0
  target_class: null
  prefer_closest_depth: true
  snapback_threshold: 35
  snapback_pause_ms: 100

recoil:
  enabled: true
  fire_key: left
  step_ms: 48
  reset_ms: 400
  pattern:
    - [0, 3]
    - [0, 3]
    - [0, 3]
    - [0, 2]
    - [0, 2]
    - [0, 2]

triggerbot:
  enabled: true
  hotkey: F5
  delay_min_ms: 15
  delay_max_ms: 45
  padding: 10

overlay:
  enabled: true
  show_boxes: true
  show_trails: true
  show_velocity: true
  show_radius_circle: true
  show_minimap: true
  show_direction_cone: true
  trail_length: 12
  active_color: [255, 200, 0]
  inactive_color: [0, 200, 255]
  box_thickness: 2
  font_scale: 0.5

perf_dashboard:
  enabled: false